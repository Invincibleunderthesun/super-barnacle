# Application Configuration
spring.application.name=firstApp

# Active Profile (dev, prod)
spring.profiles.active=dev

# JWT Configuration — REQUIRED in production (no defaults)
jwt.secret=${JWT_SECRET:devOnlySecretKeyThatMustBe32CharsMinimumLong!!}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.com.harsh.firstApp=INFO
logging.level.org.springframework.security=WARN

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# Mail Configuration (leave blank to log emails to console)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL (for password reset links)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Store Configuration (for invoices)
app.store.name=${STORE_NAME:Your E-Commerce Store}
app.store.address=${STORE_ADDRESS:India}
app.store.gstin=${STORE_GSTIN:NOT REGISTERED}
